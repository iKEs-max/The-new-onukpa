<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Cancelled - WKM Transport</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter',sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f1a2e, #1a2b4c); padding: 2rem; }
        .cancel-card { background: white; border-radius: 16px; padding: 3rem 2rem; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.25); }
        .cancel-icon { width: 80px; height: 80px; background: #FEE2E2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; font-size: 2.5rem; }
        .cancel-card h2 { color: #1a2b4c; font-size: 1.5rem; margin-bottom: 0.5rem; }
        .cancel-card p { color: #6B7280; margin-bottom: 2rem; line-height: 1.6; }
        .actions { display: flex; gap: 1rem; flex-wrap: wrap; }
        .actions a { flex: 1; padding: 0.75rem; border-radius: 8px; font-size: 0.95rem; font-weight: 600; text-decoration: none; text-align: center; transition: all 0.3s ease; }
        .btn-retry { background: #F59E0B; color: #1a2b4c; }
        .btn-retry:hover { background: #D97706; }
        .btn-home { background: #1a2b4c; color: white; }
        .btn-home:hover { background: #2d4a7a; }
    </style>
</head>
<body>
    <div class="cancel-card">
        <div class="cancel-icon">❌</div>
        <h2>Booking Cancelled</h2>
        <p>Your payment was cancelled or could not be completed. No charges were made to your account.</p>
        <div class="actions">
            <a href="/#book" class="btn-retry">Try Again</a>
            <a href="/" class="btn-home">Back Home</a>
        </div>
    </div>
</body>
</html>
